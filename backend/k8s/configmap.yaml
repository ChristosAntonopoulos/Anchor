apiVersion: v1
kind: ConfigMap
metadata:
  name: pos-api-config
  namespace: pos
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:5000"
  MongoDb__DatabaseName: "pos"
  BotSystem__BaseUrl: "http://botsystem-api-service.botsystem.svc.cluster.local"
  BotSystem__IntakeBotKey: "anchor.intake"
  BotSystem__DayStartBotKey: "anchor.day-start"
  # Azure DevOps org for home launcher latest-pipeline widget (PAT lives in secrets)
  AzureDevOps__Organization: "CaptainBot"
  AzureDevOps__CacheSeconds: "60"
  # X-Anchor-Key enforcement off for now (Chris accepts risk). Flip to "true" to re-enable.
  AnchorApi__RequireKey: "false"
  # ANC-41/ANC-42: never auto-seed/delete in Production. IsSeededAsync only checks "today"
  # and HasOldDataAsync + SeedAsync(deleteExisting:true) wiped user collections.
  Database__AutoSeedOnStartup: "false"
  # MongoDB connection string without credentials (credentials in secrets)
  # Format: mongodb://mongodb-service:27017/pos
  # Or for external MongoDB: mongodb://host:port/database
  # Actual connection string with credentials will be in secrets

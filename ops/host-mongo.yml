# Temporary host job for ANC-41 mongo restore. Not part of the product deploy.
trigger: none
pr: none

variables:
  - group: POS-Secrets

pool:
  name: Default
  demands:
    - Agent.Name -equals contabo-agent-2

steps:
  - checkout: self
    clean: true
  - bash: bash ops/host-mongo.sh apply
    displayName: Apply Anchor/pos mongo user
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      # Reuse org PAT already in POS-Secrets (never echo)
      ADO_PAT: $(AzureDevOps__PersonalAccessToken)
